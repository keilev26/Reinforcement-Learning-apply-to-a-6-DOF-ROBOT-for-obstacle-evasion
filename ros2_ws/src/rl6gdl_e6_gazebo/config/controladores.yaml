# Controladores del Magician E6 en Gazebo (paquete 3.8).

# Plugin gz_ros2_control: la interfaz de posición se sigue con un control proporcional de
# velocidad, v = ganancia x update_rate x error. Con el default 0.1 la constante de tiempo es de
# 40 ms y el brazo se retrasa ~0.06 rad a 1.67 rad/s. Medido en el escenario 2 (error de
# seguimiento máximo del JointTrajectoryController):
#   0.1 (default) -> 0.061 rad   |   0.5 -> 0.008 rad   |   1.0 -> 0.084 rad (sobreoscila)
# Se adopta 0.5. Ver docs/semana-05/3.8-gazebo-magician-e6.md.
gz_ros_control:
  ros__parameters:
    position_proportional_gain: 0.5
controller_manager:
  ros__parameters:
    update_rate: 250  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    brazo_controller:
      type: joint_trajectory_controller/JointTrajectoryController

brazo_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    # Tolerancias: si el seguimiento se desvía más de 0.1 rad en cualquier articulación, la
    # ejecución se aborta. Es la garantía de que lo que se ejecuta es lo que se planificó.
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 1.0
      joint1: {trajectory: 0.1, goal: 0.01}
      joint2: {trajectory: 0.1, goal: 0.01}
      joint3: {trajectory: 0.1, goal: 0.01}
      joint4: {trajectory: 0.1, goal: 0.01}
      joint5: {trajectory: 0.1, goal: 0.01}
      joint6: {trajectory: 0.1, goal: 0.01}
